<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
  <title>AFK Cat Arcade</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/arcade.css">
</head>
<body>
  <main>
    <header>
      <h1>🐾 AFK Cat Arcade <span id="mode"></span></h1>
      <span id="cat">Waiting for your cats…</span>
    </header>
    <p id="log"></p>
    <section id="menu">
      <p id="rules"></p>
      <div id="games"></div>
    </section>
    <section id="play" hidden>
      <div id="display-options">
        <label for="resolution">Display</label>
        <select id="resolution" aria-label="Display resolution">
          <option value="fit">Fit window</option>
          <option value="1">320×180</option>
          <option value="2">640×360</option>
          <option value="3">960×540</option>
          <option value="4">1280×720</option>
          <option value="5">1600×900</option>
          <option value="6">1920×1080</option>
        </select>
        <button id="fullscreen" type="button">Fullscreen</button>
      </div>
      <canvas id="screen" tabindex="0" aria-label="Game screen"></canvas>
      <div id="hud"></div>
      <div id="controls"></div>
    </section>
  </main>
  <script src="/arcade.js"></script>
</body>
</html>
